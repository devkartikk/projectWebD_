<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Event Registration</title>
    <link rel="stylesheet" href="CA.css">
</head>
<body>
    <h1>College Event Registration</h1>
    <form onsubmit="return formValidate()">

    Name : <input type="text" id="name"><br><br>
    Roll Number : <input type="text" id="roll"><br><br>
    Email : <input type="text" id="email"><br><br>
    
    Select Event :<br>
    <input type="radio" name="event" id="coding" value="Coding"> Coding
    <input type="radio" name="event" id="quiz" value="Quiz"> Quiz
    <input type="radio" name="event" id="dance" value="Dance"> Dance<br><br>
    <input type="submit" value="Submit">
    <input type="reset" value="Reset">
    </form>

    <div id="result"></div>

    <script>
        function formValidate() {
            let name = document.getElementById("name").value;
            let roll = document.getElementById("roll").value;
            let email = document.getElementById("email").value;

            let coding = document.getElementById("coding");
            let quiz = document.getElementById("quiz");
            let dance = document.getElementById("dance");

            let event = "";

            if (coding.checked) {
                event = coding.value;
            }
            if (quiz.checked) {
                event = quiz.value;
            }
            if (dance.checked) {
                event = dance.value;
            }

            if (name == "" || roll == "" || email == "") {
                alert("All fields must be filled out");
                return false;
            }

            if (event == "") {
                alert("Please select an event");
                return false;
            }

            document.getElementById("result").innerHTML = 
            `<h2>Registration Details:</h2>
            <p>Name: ${name}</p>
            <p>Roll Number: ${roll}</p>
            <p>Email: ${email}</p>
            <p>Event: ${event}</p>`;
            return false;
        }
    </script>   
</body>
</html>
